<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Z - Home</title>

    <link rel="icon" type="image/x-icon" href="xil_web.ico">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", sans-serif;
            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #e4f6df,
                    #f5f9d8,
                    #d9f1e1
                );

            color: #183c25;
        }

        h3 {
            font-size: 400%;
            margin: 30px 0 35px;

            color: #183c25;
        }

        .subjects {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;

            flex-wrap: wrap;
        }


        /* =========================
           SUBJECT BUTTONS
        ========================== */

        .subject {
            display: flex;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 12px;

            width: 180px;
            height: 180px;

            border-radius: 22px;

            text-decoration: none;

            font-size: 230%;
            font-weight: bold;

            color: white;

            border: 3px solid rgba(255,255,255,.8);

            box-shadow:
                0 12px 30px rgba(40,90,50,.18);

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                filter .35s ease;
        }

        .subject:hover {
            transform:
                translateY(-8px)
                scale(1.03);

            box-shadow:
                0 20px 40px rgba(40,90,50,.25);

            filter: brightness(1.05);
        }

        .subject:active {
            transform: scale(.96);
        }


        /* =========================
           MATH
        ========================== */

        .math {
            background:
                linear-gradient(
                    135deg,
                    #ffbd70,
                    #e8ed72
                );

            color: #fff4df;

            -webkit-text-stroke:
                1px #7a3e00;
        }

        .math-icon {
            height: 90px;
            width: auto;

            margin-bottom: 8px;
        }


        /* =========================
           ENGLISH
        ========================== */

        .english {
            background:
                linear-gradient(
                    135deg,
                    #72c985,
                    #b5db70
                );

            color: #f4fff2;

            -webkit-text-stroke:
                1px #28633a;
        }

        .english-icon {
            height: 90px;
            width: auto;

            margin-bottom: 8px;
        }


        /* =========================
           LOGO
        ========================== */

        .logo {
            display: block;

            margin: 55px auto 0;

            height: 100px;
            width: auto;

            filter:
                drop-shadow(
                    0 8px 12px
                    rgba(30,80,40,.15)
                );
        }

        .copyright {
            color: #587461;
            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            h3 {
                font-size: 32px;
                margin-top: 25px;
            }

            .subjects {
                gap: 15px;
            }

            .subject {
                width: 140px;
                height: 140px;

                font-size: 26px;
            }

            .math-icon,
            .english-icon {
                height: 65px;
            }

            .logo {
                height: 80px;
                margin-top: 40px;
            }
        }

    </style>
</head>


<body>

    <h3>Choose</h3>


    <div class="subjects">

        <!-- MATH -->

        <a
            href="/math"
            class="subject math"
        >
            <img
                src="calculate-math-icon.webp"
                alt="Math"
                class="math-icon"
            >

            Math
        </a>


        <!-- ENGLISH -->

        <a
            href="/english"
            class="subject english"
        >
            📚
            <span>English</span>
        </a>

    </div>


    <img
        src="xil_web.ico"
        alt="Z logo"
        class="logo"
    >

    <p class="copyright">
        Z © 2026
    </p>

</body>

</html>
