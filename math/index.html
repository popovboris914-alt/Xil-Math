<!DOCTYPE html>
<html lang="en">
<head>
  <title>Z - Math</title>
  <link rel="icon" type="image/png" href="xil_web.ico">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    :root {
      --green-950: #10291c;
      --green-900: #163b26;
      --green-800: #1e5632;
      --green-700: #287044;
      --green-600: #358c54;
      --green-500: #50ad6b;

      --mint: #dff4e4;
      --cream: #f5faef;

      --text: #183323;
      --muted: #66806e;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "DM Sans", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(144, 218, 157, 0.55),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 15%,
          rgba(190, 229, 181, 0.65),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(117, 190, 133, 0.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #dff4df,
          #eef8e9 45%,
          #d4edd7
        );

      padding: 40px 18px;
      overflow-x: hidden;

      animation: pageIn 0.9s var(--ease) both;
    }

    /* =========================
       FLOATING BACKGROUND
    ========================= */

    body::before,
    body::after {
      content: "";
      position: fixed;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      filter: blur(75px);

      opacity: 0.3;

      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background: #62bd78;
      top: -120px;
      left: -120px;

      animation:
        blobOne 14s ease-in-out infinite alternate;
    }

    body::after {
      background: #b1db70;
      right: -120px;
      bottom: -120px;

      animation:
        blobTwo 17s ease-in-out infinite alternate;
    }

    /* =========================
       MAIN CARD
    ========================= */

    section {
      width: min(920px, 100%);
      margin: 0 auto;

      padding: 34px;

      background: rgba(255, 255, 255, 0.62);

      border: 1px solid rgba(255, 255, 255, 0.78);

      border-radius: 30px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 30px 80px rgba(31, 82, 46, 0.13),
        0 8px 25px rgba(31, 82, 46, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);

      position: relative;
      overflow: hidden;

      animation: cardIn 1s var(--ease) 0.05s both;
    }

    section::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 5px;

      background:
        linear-gradient(
          90deg,
          #2b7042,
          #64bd78,
          #c0df79,
          #64bd78,
          #2b7042
        );

      background-size: 250% 100%;

      animation: gradientMove 5s linear infinite;
    }

    /* =========================
       HEADER
    ========================= */

    h3 {
      position: relative;

      margin: 0 0 30px;
      padding: 30px;

      border-radius: 23px;

      color: white;

      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.1;
      font-weight: 800;

      letter-spacing: -1.5px;

      text-align: left;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(173, 235, 159, 0.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #163b26,
          #245d35 48%,
          #3b8b50
        );

      box-shadow:
        0 18px 35px rgba(28, 91, 45, 0.2),
        inset 0 1px 0 rgba(255,255,255,0.15);

      overflow: hidden;

      animation:
        headerIn 0.9s var(--ease) 0.25s both;
    }

    h3::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -60px;
      top: -90px;

      border-radius: 50%;

      background: rgba(255,255,255,0.08);

      animation: headerOrb 7s ease-in-out infinite;
    }

    h3::after {
      content: "20 QUESTIONS";

      display: block;

      margin-top: 13px;

      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 700;

      letter-spacing: 2px;

      color: #ccebd2;
    }

    /* =========================
       QUIZ
    ========================= */

    #quiz {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-top: 10px;
    }

    .problem {
      min-height: 76px;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 15px 17px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.9),
          rgba(239,249,237,0.75)
        );

      border: 1px solid rgba(105, 155, 115, 0.18);

      border-radius: 17px;

      box-shadow:
        0 5px 15px rgba(35, 88, 48, 0.05);

      transition:
        transform 0.45s var(--ease),
        box-shadow 0.45s var(--ease),
        border-color 0.35s ease,
        background 0.35s ease;

      animation:
        problemIn 0.65s var(--ease) both;

      /* Staggered entrance */
      animation-delay:
        calc(var(--i) * 45ms + 450ms);
    }

    .problem:hover {
      transform:
        translateY(-4px)
        scale(1.008);

      border-color: rgba(74, 143, 88, 0.35);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.98),
          rgba(235,249,233,0.9)
        );

      box-shadow:
        0 15px 30px rgba(35, 88, 48, 0.1);
    }

    label {
      flex: 1;

      font-family: "Plus Jakarta Sans", sans-serif;

      font-size: 17px;
      font-weight: 700;

      color: #254c31;

      white-space: nowrap;

      transition:
        color 0.3s ease,
        transform 0.3s var(--ease);
    }

    .problem:focus-within label {
      color: #287044;
      transform: translateX(2px);
    }

    /* =========================
       INPUT
    ========================= */

    input[type="number"] {
      width: 78px;
      height: 43px;

      padding: 5px 8px;

      border: 2px solid #c4ddc8;

      border-radius: 12px;

      background: rgba(255,255,255,0.9);

      color: #20472c;

      font-family: "Plus Jakarta Sans", sans-serif;

      font-size: 16px;
      font-weight: 700;

      text-align: center;

      outline: none;

      transition:
        border-color 0.35s ease,
        box-shadow 0.4s var(--ease),
        transform 0.4s var(--ease),
        background 0.35s ease;
    }

    input[type="number"]:hover {
      border-color: #8fc49a;

      transform: translateY(-1px);
    }

    input[type="number"]:focus {
      border-color: #4eaa68;

      background: white;

      transform:
        translateY(-2px)
        scale(1.025);

      box-shadow:
        0 8px 20px rgba(78, 170, 104, 0.12),
        0 0 0 4px rgba(78, 170, 104, 0.12);
    }

    input[type="number"]:disabled {
      background: #edf5eb;

      color: #78907d;

      border-color: #d2e3d3;

      transform: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* =========================
       RESULTS
    ========================= */

    .result {
      min-width: 100px;

      font-size: 12px;
      font-weight: 700;

      color: #c45151;

      line-height: 1.2;

      animation: resultIn 0.45s var(--ease) both;
    }

    #finalResult {
      min-height: 32px;

      margin: 25px 0 12px;

      color: #328048;

      font-family: "Plus Jakarta Sans", sans-serif;

      font-size: 22px;
      font-weight: 800;

      animation: successIn 0.7s var(--ease);
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      position: relative;

      overflow: hidden;

      border: none;

      border-radius: 13px;

      padding: 12px 19px;

      margin: 5px;

      font-family: "DM Sans", sans-serif;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.4s var(--ease),
        box-shadow 0.4s var(--ease),
        background 0.35s ease,
        opacity 0.3s ease;
    }

    button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      transform: skewX(-20deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.28),
          transparent
        );

      transition: left 0.7s var(--ease);
    }

    button:hover::before {
      left: 140%;
    }

    button:not(:disabled) {
      color: white;

      background:
        linear-gradient(
          135deg,
          #245f35,
          #398b51
        );

      box-shadow:
        0 7px 16px rgba(39, 107, 57, 0.2);
    }

    button:not(:disabled):hover {
      transform:
        translateY(-3px)
        scale(1.02);

      box-shadow:
        0 13px 26px rgba(39, 107, 57, 0.25);
    }

    button:not(:disabled):active {
      transform:
        translateY(0)
        scale(0.97);

      transition-duration: 0.1s;
    }

    button:nth-of-type(2),
    button:nth-of-type(3) {
      color: #285a35;

      background:
        rgba(226, 243, 225, 0.9);

      border: 1px solid #c1dec5;

      box-shadow: none;
    }

    button:nth-of-type(2):hover,
    button:nth-of-type(3):hover {
      background: #d8eed9;

      box-shadow:
        0 9px 20px rgba(48, 104, 59, 0.1);
    }

    button:disabled {
      color: #91a696;

      background: #e5eee4;

      border: 1px solid #d7e4d6;

      cursor: not-allowed;

      box-shadow: none;

      opacity: 0.7;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pageIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform:
          translateY(35px)
          scale(0.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes headerIn {
      from {
        opacity: 0;
        transform:
          translateY(-18px)
          scale(0.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes problemIn {
      from {
        opacity: 0;
        transform:
          translateY(18px)
          scale(0.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes resultIn {
      from {
        opacity: 0;
        transform: translateX(8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes successIn {
      0% {
        opacity: 0;
        transform:
          translateY(8px)
          scale(0.95);
      }

      70% {
        transform:
          translateY(-2px)
          scale(1.03);
      }

      100% {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    @keyframes blobOne {
      0% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(80px, 50px)
          scale(1.15);
      }

      100% {
        transform:
          translate(20px, 100px)
          scale(0.95);
      }
    }

    @keyframes blobTwo {
      0% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(-70px, -50px)
          scale(1.12);
      }

      100% {
        transform:
          translate(-20px, -100px)
          scale(0.95);
      }
    }

    @keyframes headerOrb {
      0%,
      100% {
        transform:
          translate(0, 0)
          scale(1);
      }

      50% {
        transform:
          translate(-35px, 30px)
          scale(1.15);
      }
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 250% 50%;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      body {
        padding: 14px 10px;
      }

      section {
        padding: 18px;
        border-radius: 23px;
      }

      h3 {
        padding: 23px 20px 20px;

        margin-bottom: 20px;

        font-size: 2rem;

        letter-spacing: -1px;
      }

      #quiz {
        grid-template-columns: 1fr;

        gap: 9px;
      }

      .problem {
        min-height: 68px;

        padding: 12px;
      }

      label {
        font-size: 15px;
      }

      input[type="number"] {
        width: 72px;
        height: 40px;
      }

      .result {
        min-width: 85px;
        font-size: 11px;
      }

      button {
        padding: 11px 14px;
        margin: 4px 2px;
      }
    }

    @media (max-width: 420px) {

      section {
        padding: 12px;
      }

      h3 {
        font-size: 1.7rem;
      }

      .problem {
        gap: 6px;
      }

      label {
        font-size: 14px;
      }

      input[type="number"] {
        width: 65px;
      }

      .result {
        min-width: 70px;
      }
    }

    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* =========================
       PRINT
    ========================= */

    @media print {

      body {
        background: white;
        padding: 0;
      }

      section {
        width: 100%;
        margin: 0;
        padding: 10px;

        border: none;
        box-shadow: none;
        background: white;
      }

      h3 {
        color: #163b26;

        background: #e5f3e5;

        box-shadow: none;
      }

      button {
        display: none;
      }

      .problem {
        break-inside: avoid;

        box-shadow: none;
      }
    }
  </style>
</head>

<body>

<section>

  <h3>Test your math skills | Z</h3>

  <div id="quiz"></div>

  <p id="finalResult"></p>

  <button onclick="checkAnswers()">Check</button>
  <button onclick="printQuiz()" id="printBtn" disabled>Print</button>
  <button onclick="restart()">Restart</button>

</section>

<script>
  const TOTAL = 20;
  let problems = [];
  let checked = false;

  function limitValue(input) {
    if (input.value === "") return;

    let v = Number(input.value);

    if (v > 1000) input.value = 1000;
    if (v < 0) input.value = 0;
  }

  function generateQuiz() {
    problems = [];
    checked = false;

    document.getElementById("quiz").innerHTML = "";
    document.getElementById("finalResult").textContent = "";
    document.getElementById("printBtn").disabled = true;

    for (let i = 0; i < TOTAL; i++) {

      let a = Math.floor(Math.random() * 1001);
      let b = Math.floor(Math.random() * 1001);

      let op = Math.random() < 0.5 ? "+" : "-";

      if (op === "-") {

        if (a < b) [a, b] = [b, a];

      } else {

        if (a + b > 1000) {
          b = 1000 - a;
        }

      }

      let answer = op === "+" ? a + b : a - b;

      problems.push(answer);

      const div = document.createElement("div");

      div.className = "problem";

      /* Used for the staggered animation */
      div.style.setProperty("--i", i);

      div.innerHTML = `
        <label>${a} ${op} ${b} =</label>

        <input
          type="number"
          min="0"
          max="1000"
          oninput="limitValue(this)"
        >

        <span class="result"></span>
      `;

      document
        .getElementById("quiz")
        .appendChild(div);
    }
  }

  function checkAnswers() {

    const inputs =
      document.querySelectorAll("#quiz input");

    const results =
      document.querySelectorAll(".result");

    let allCorrect = true;

    inputs.forEach((input, i) => {

      input.disabled = true;

      if (input.value != problems[i]) {

        results[i].textContent =
          "Correct: " + problems[i];

        allCorrect = false;

      } else {

        results[i].textContent = "";

      }

    });

    const finalResult =
      document.getElementById("finalResult");

    finalResult.textContent =
      allCorrect
        ? "Perfect! Every answer is correct. 🌿"
        : "Keep practicing — you've got this!";

    /* Restart the result animation */
    finalResult.style.animation = "none";
    void finalResult.offsetWidth;
    finalResult.style.animation =
      "successIn 0.7s var(--ease)";

    checked = true;

    document.getElementById("printBtn").disabled = false;
  }

  function printQuiz() {

    if (!checked) {
      alert("Please click Check before printing!");
      return;
    }

    window.print();
  }

  function restart() {

    const quiz =
      document.getElementById("quiz");

    /* Smoothly fade questions out */
    quiz.style.opacity = "0";
    quiz.style.transform = "translateY(8px)";

    setTimeout(() => {

      generateQuiz();

      quiz.style.transition =
        "opacity 0.5s ease, transform 0.5s var(--ease)";

      requestAnimationFrame(() => {
        quiz.style.opacity = "1";
        quiz.style.transform = "translateY(0)";
      });

    }, 180);
  }

  generateQuiz();
</script>

</body>
</html>
